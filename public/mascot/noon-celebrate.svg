<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -55 280 255" width="280" height="255" role="img" aria-label="Noon celebrating" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>@keyframes nw-wave{0%,100%{transform:rotate(4deg)}50%{transform:rotate(28deg)}}
@keyframes nw-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}60%{transform:translateY(0)}70%{transform:translateY(-5px)}}
@keyframes nw-draw{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@keyframes nw-glow{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes nw-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes nw-z{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(12px,-22px)}}
.nw-wave{transform-origin:174px 152px;transform-box:view-box;animation:nw-wave 1.4s ease-in-out infinite}
.nw-hop{animation:nw-hop 2.4s ease-in-out infinite}
.nw-draw{stroke-dasharray:100;animation:nw-draw 3.2s ease-in-out infinite}
.nw-glow{animation:nw-glow 2s ease-in-out infinite}
.nw-float{animation:nw-float 3s ease-in-out infinite}
.nw-z{animation:nw-z 2.6s ease-out infinite}.nw-z2{animation:nw-z 2.6s ease-out .9s infinite}
@media (prefers-reduced-motion: reduce){.nw-wave,.nw-hop,.nw-draw,.nw-glow,.nw-float,.nw-z,.nw-z2{animation:none}}</style><rect x="-8" y="-20" width="14" height="7" rx="3" fill="#FF6B5B" transform="rotate(30 -1 -16)"/><rect x="200" y="-30" width="14" height="7" rx="3" fill="#0E7C7B" transform="rotate(-25 207 -26)"/><circle cx="10" cy="30" r="6" fill="#FFC845"/><circle cx="226" cy="40" r="6" fill="#FF6B5B"/><rect x="150" y="-48" width="10" height="10" rx="2" fill="#FFC845"/><rect x="20" y="-48" width="10" height="10" rx="2" fill="#0E7C7B"/><g class="nw-hop"><path d="M26 64 C20 112 30 158 70 160 C104 162 114 120 112 64 C128 92 150 124 174 152" fill="none" stroke="#FF6B5B" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><g><path d="M174 152 C172 122 173 94 174 60" fill="none" stroke="#FF6B5B" stroke-width="17" stroke-linecap="round" transform="rotate(28 174 152)"/></g><g transform="translate(69 26) scale(1.8) translate(-69 -26)"><path d="M64 12 C77 6 89 19 83 32 C77 44 57 42 55 30 C54 21 57 15 64 12 Z" fill="#FFC845" stroke="#0E2A2D" stroke-width="2"/><path d="M61 26 Q64 22 67 26" fill="none" stroke="#0E2A2D" stroke-width="1.8" stroke-linecap="round"/><path d="M72 26 Q75 22 78 26" fill="none" stroke="#0E2A2D" stroke-width="1.8" stroke-linecap="round"/><path d="M64 30 Q69.5 37 75 30 Z" fill="#0E2A2D"/></g></g></svg>